<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="ndadevdev, full-stack developer banner">
  <style>
    @keyframes blink   { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes pulseA  { 0%, 100% { opacity: .45; transform: translate(0, 0) } 50% { opacity: .85; transform: translate(-20px, -14px) } }
    @keyframes pulseB  { 0%, 100% { opacity: .4; transform: translate(0, 0) } 50% { opacity: .8; transform: translate(18px, 12px) } }
    @keyframes drift   { 0% { transform: translate(0, 0); opacity: 0 } 10% { opacity: .7 } 85% { opacity: .5 } 100% { transform: translate(70px, -110px); opacity: 0 } }
    @keyframes breathe { 0%, 100% { opacity: .05 } 50% { opacity: .11 } }
    @keyframes sheen   { 0%, 100% { opacity: .05 } 50% { opacity: .13 } }
    @keyframes floatLine { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
    .p1  { animation: drift 8s linear infinite backwards; }
    .p2  { animation: drift 10s linear infinite backwards; animation-delay: 1.3s; }
    .p3  { animation: drift 9s linear infinite backwards; animation-delay: 2.6s; }
    .p4  { animation: drift 11s linear infinite backwards; animation-delay: 0.8s; }
    .p5  { animation: drift 8.5s linear infinite backwards; animation-delay: 3.4s; }
    .p6  { animation: drift 10s linear infinite backwards; animation-delay: 2s; }
    .p7  { animation: drift 9.5s linear infinite backwards; animation-delay: 4.2s; }
    .p8  { animation: drift 8s linear infinite backwards; animation-delay: 5s; }
    .p9  { animation: drift 11s linear infinite backwards; animation-delay: 3s; }
    .p10 { animation: drift 9s linear infinite backwards; animation-delay: 6s; }
    .cursor    { animation: blink 1.15s infinite; }
    .glow-a    { animation: pulseA 7s ease-in-out infinite; }
    .glow-b    { animation: pulseB 9s ease-in-out infinite; }
    .watermark { animation: breathe 6s ease-in-out infinite; }
    .sheen     { animation: sheen 10s ease-in-out infinite; }
    .accent    { animation: floatLine 4.5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .p1, .p2, .p3, .p4, .p5, .p6, .p7, .p8, .p9, .p10,
      .cursor, .glow-a, .glow-b, .watermark, .sheen, .accent { animation: none; }
    }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1526"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#090a12"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#38bdf8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect class="sheen" width="1200" height="300" fill="url(#sheenGrad)"/>

  <circle class="glow-a" cx="250" cy="90" r="250" fill="url(#glowCyan)"/>
  <circle class="glow-b" cx="980" cy="240" r="270" fill="url(#glowViolet)"/>

  <g>
    <circle class="particle p1"  cx="120"  cy="245" r="2.5" fill="#38bdf8" opacity="0.5"/>
    <circle class="particle p2"  cx="310"  cy="215" r="2"   fill="#8b5cf6" opacity="0.4"/>
    <circle class="particle p3"  cx="520"  cy="255" r="3"   fill="#38bdf8" opacity="0.5"/>
    <circle class="particle p4"  cx="680"  cy="225" r="2"   fill="#38bdf8" opacity="0.4"/>
    <circle class="particle p5"  cx="840"  cy="245" r="2.5" fill="#8b5cf6" opacity="0.5"/>
    <circle class="particle p6"  cx="1000" cy="235" r="2"   fill="#38bdf8" opacity="0.4"/>
    <circle class="particle p7"  cx="190"  cy="150" r="1.5" fill="#38bdf8" opacity="0.4"/>
    <circle class="particle p8"  cx="760"  cy="140" r="2"   fill="#8b5cf6" opacity="0.4"/>
    <circle class="particle p9"  cx="450"  cy="115" r="1.5" fill="#38bdf8" opacity="0.4"/>
    <circle class="particle p10" cx="1100" cy="145" r="2"   fill="#38bdf8" opacity="0.4"/>
  </g>

  <text class="watermark" x="985" y="238" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="110" fill="#38bdf8">&lt;/&gt;</text>

  <text x="64" y="148" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="26" font-weight="700" fill="#38bdf8">&gt;</text>
  <text x="116" y="152" font-family="'Segoe UI','Helvetica Neue',system-ui,sans-serif" font-size="62" font-weight="700" fill="#e6edf3">ndadevdev</text>
  <rect class="cursor" x="400" y="110" width="5" height="44" rx="2.5" fill="#38bdf8"/>

  <text x="66" y="206" font-family="'Segoe UI','Helvetica Neue',system-ui,sans-serif" font-size="24" fill="#8b949e">full-stack developer<tspan fill="#38bdf8"> · </tspan>web<tspan fill="#38bdf8"> · </tspan>backend<tspan fill="#38bdf8"> · </tspan>DevOps<tspan fill="#38bdf8"> · </tspan>AI &amp; data</text>

  <rect class="accent" x="66" y="238" width="220" height="3" fill="url(#accentLine)"/>
</svg>
